name: EHApiTestPlugin
version: 1.0.0
main: me.mapacheee.examples.ehapitest.EhApiTestPlugin
api-version: '1.20'
depend: [ExtendedHorizons]

commands:
  ehtest:
    description: Test command for ExtendedHorizons API
    usage: /ehtest <get|set|reset|max|world|far> [value]
    permission: ehapitest.use

permissions:
  ehapitest.use:
    default: true
