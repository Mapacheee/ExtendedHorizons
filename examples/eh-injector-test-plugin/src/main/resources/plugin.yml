name: EHInjectorTestPlugin
version: 1.0.0
main: me.mapacheee.examples.ehinjectortest.EhInjectorTestPlugin
api-version: '1.20'
depend: [ExtendedHorizons]
folia-supported: true

commands:
  ehtest:
    description: Test command for ExtendedHorizons injector services
    usage: /ehtest <get|set|reset|max|world|far> [value]
    permission: ehinjectortest.use

permissions:
  ehinjectortest.use:
    default: true
