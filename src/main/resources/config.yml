# Global view distance limits and defaults
# Note: The minimum distance is automatically set to the server's view-distance from server.properties
view-distance:
  max-distance: 64
  default-distance: 32

# Per-world settings (optional)
# If a world is not listed here, it will use the global settings above
world-settings:
  # Example: Limit view distance in the Nether
  # world_nether:
  #   enabled: true
  #   max-distance: 32

  # Example: Disable fake chunks in the End
  # world_the_end:
  #   enabled: false
  #   max-distance: 64

# Performance settings
performance:
  # Number of threads for chunk processing (0 = auto-detect based on CPU cores)
  # Recommended: 0 (auto) or 2-4 for most servers
  chunk-processor-threads: 0

  # Delay in milliseconds before loading fake chunks after teleport
  # Gives the server time to load real chunks first
  # During this period + 2 seconds, chunk loading is boosted 3-4x for faster loading
  teleport-warmup-delay: 10

  # MSPT (Milliseconds Per Tick) should be ~50ms normally (20 TPS)
  # If MSPT > this value, the server is lagging and chunk loading pauses
  # Recommended: 40-50 for most servers, 0 to disable protection
  # Note: On Folia, uses TPS-based calculation as fallback
  max-mspt-for-loading: 40.0

  # Async Task Throttling: Limits concurrent chunk loading
  max-async-load-tasks: 4
  max-async-load-queue: 10

  # Strict limits per tick to prevent lag spikes
  max-generations-per-tick: 2
  max-disk-loads-per-tick: 22

  # Fake chunks system configuration
  fake-chunks:
    enabled: true
