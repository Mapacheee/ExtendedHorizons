debug:
  enabled: false

fake-chunks:
  target-view-distance: 32
  max-send-per-cycle: 3
  max-inflight-per-player: 5
  chunk-queue-size: 16
  dispatch-time-budget-nanos: 900000
  generate-missing-chunks: true
  force-plan-interval-ms: 900
  unavailable-retry-ms: 150
  safe-square-factor: 0.80
  runtime:
    period-ticks: 1
  far-players:
    move-ticks: 4
    equip-ticks: 15
  cache:
    ttl-seconds: 15
    max-entries: 1500
    bypass-after-real-interaction-ms: 3000

world-settings:
  world:
    enable-fakechunks: true
    target-distance: 32
  world_nether:
    enable-fakechunks: false
    target-distance: 16

