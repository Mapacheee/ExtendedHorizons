# Global view distance limits and defaults
# Note: The minimum distance is automatically set to the server's view-distance from server.properties
view-distance:
  max-distance: 64
  default-distance: 32

# Per-world settings (optional)
# If a world is not listed here, it will use the global settings above
world-settings:
  # Example: Limit view distance in the Nether
  # world_nether:
  #   enabled: true
  #   max-distance: 32

  # Example: Disable fake chunks in the End
  # world_the_end:
  #   enabled: false
  #   max-distance: 64

# Performance settings
performance:
  # Number of threads for chunk processing (0 = auto-detect based on CPU cores)
  # Recommended: 0 (auto) or 2-4 for most servers
  chunk-processor-threads: 0

  # Delay in milliseconds before loading fake chunks after teleport
  # Gives the server time to load real chunks first
  # During this period + 2 seconds, chunk loading is boosted 3-4x for faster loading
  teleport-warmup-delay: 10

  # MSPT (Milliseconds Per Tick) should be ~50ms normally (20 TPS)
  # If MSPT > this value, the server is lagging and chunk loading pauses
  # Recommended: 40-50 for most servers, 0 to disable protection
  # Note: On Folia, uses TPS-based calculation as fallback
  max-mspt-for-loading: 40.0

  # Async Task Throttling: Limits concurrent chunk loading
  max-async-load-tasks: 4
  max-async-load-queue: 10

  # Strict limits per tick to prevent lag spikes
  max-generations-per-tick: 2
  chunk-process-interval: 5

  # Fake chunks system configuration
  fake-chunks:
    enabled: true

    # RAM Cache for processed packets (faster resending)
    # Higher = more RAM usage, faster chunk resending
    max-cached-packets: 2000

    # Memory cache for NMS chunk objects (reuses loaded chunks)
    # Recommended: true for small servers, false for large servers or low RAM
    enable-memory-cache: true
    max-memory-cache-size: 500

    # Interval (in seconds) to clean up old packets from the memory cache
    cache-cleanup-interval: 300

    # How long to keep a packet in memory before it is evicted (in seconds)
    packet-cache-ttl-seconds: 600

    # Compress packets before saving to disk (slower but smaller files)
    use-compression: false

    # Anti-Xray for fake chunks
    # True: Ores hidden in distance, higher CPU usage
    # False: Raw chunk data, faster but xray-able
    anti-xray:
      enabled: false
      hide-ores: true
      add-fake-ores: true
      fake-ore-density: 0.1

  # Occlusion Culling: Disables fake chunks when player is underground
  # Saves bandwidth when player can't see the distance anyway
  occlusion-culling:
    enabled: true
    sky-light-threshold: 14
    max-y-level: 320
    min-y-level: -64

# Bandwidth management
bandwidth-saver:
  enabled: true

  # Skip redundant entity packets (minor bandwidth savings)
  skip-redundant-packets: true

  # Maximum fake chunks to send per tick (20 ticks = 1 second)
  max-fake-chunks-per-tick: 22

  # Maximum bandwidth per player in KB/s (0 = unlimited)
  # 512 KB/s ≈ 4 Mbps
  max-bandwidth-per-player: 10000

  # Reduce packet rate for high-ping players
  adaptive-rate-limiting: true

  # Custom bandwidth limits assignable via permission
  # Permission: extendedhorizons.bandwidth.<profile_name>
  bandwidth-profiles:
    vip: 20000
    slow: 50

  # Estimated chunk packet size in bytes (used for bandwidth calculations)
  estimated-packet-size: 50000

# Database for storing player preferences
database:
  enabled: true
  file-name: "extendedhorizons"

# Plugin integrations
integrations:
  placeholderapi:
    enabled: true
  luckperms:
    enabled: true
    check-interval: 60
    use-group-permissions: true

# Message settings (texts are in messages.yml)
messages:
  welcome-message:
    enabled: false