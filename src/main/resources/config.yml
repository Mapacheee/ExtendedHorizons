# Global debug options.
debug:
  # Enables extra internal behavior toggles (not runtime spam logs).
  enabled: false

fake-chunks:
  # Maximum fake chunk view distance used as global default when a world has no override.
  target-view-distance: 32

  # Serialization backend.
  # FAST = optimized binary writer (recommended), VANILLA = Mojang packet writer fallback mode.
  serializer-mode: FAST

  # Number of serializer workers.
  # 0 = inline, 1..16 = async pool threads (used for non anti-xray serialization).
  serialization-workers: 1

  bandwidth:
    # Per-player bandwidth limiter for fake chunk payloads.
    # When enabled, payload sends are paced by a token bucket.
    enabled: false
    # Sustained budget in bytes per second per player.
    bytes-per-second: 384000
    # Burst capacity in bytes (must be >= bytes-per-second).
    burst-bytes: 768000

  # Max newly queued fake chunks per player processing cycle.
  max-send-per-cycle: 3

  # Global limit of new chunk generations per tick (protects TPS under load).
  max-global-generations-per-tick: 6

  # Max in-flight chunk builds per player.
  max-inflight-per-player: 5

  # Hard queue cap per player.
  chunk-queue-size: 16

  # If true, missing chunks can be generated. If false, only already-available chunks are used.
  generate-missing-chunks: false

  # Retry delay (ms) for chunks temporarily unavailable.
  unavailable-retry-ms: 150


  anti-xray:
    # Global anti-xray master switch. Per-world value can override this.
    enabled: false

  runtime:
    # Main runtime task period in ticks.
    period-ticks: 1

  far-players:
    # Enables/disables far-player tracking.
    enabled: true
    # Update interval for far-player movement packets.
    move-ticks: 4
    # Update interval for far-player equipment/metadata packets.
    equip-ticks: 20

  cache:
    # Serialized fake chunk cache TTL.
    ttl-seconds: 15
    # Max cache entries.
    max-entries: 1500
    # Cache bypass window after real interaction invalidation.
    bypass-after-real-interaction-ms: 3000
    # Max entries in permission cache (player distance permissions).
    permission-cache-entries: 4096
    # Permission cache TTL in seconds.
    permission-cache-ttl-seconds: 5
    # Max entries in far player cache (player states and equipment).
    far-player-cache-entries: 500

# Per-world overrides.
world-settings:
  world:
    # Enables fake chunks in this world.
    enable-fakechunks: true
    # Effective fake chunk target distance for this world.
    target-distance: 32
    anti-xray:
      # World override for anti-xray.
      enabled: false
      # Block states to hide in fake chunks when anti-xray is enabled.
      hidden-blocks:
        - minecraft:diamond_ore
        - minecraft:deepslate_diamond_ore
        - minecraft:gold_ore
        - minecraft:deepslate_gold_ore
        - minecraft:iron_ore
        - minecraft:deepslate_iron_ore
        - minecraft:emerald_ore
        - minecraft:deepslate_emerald_ore
        - minecraft:redstone_ore
        - minecraft:deepslate_redstone_ore
        - minecraft:lapis_ore
        - minecraft:deepslate_lapis_ore
        - minecraft:coal_ore
        - minecraft:deepslate_coal_ore
        - minecraft:copper_ore
        - minecraft:deepslate_copper_ore
        - minecraft:ancient_debris

  world_nether:
    enable-fakechunks: false
    target-distance: 16
    anti-xray:
      enabled: false
      hidden-blocks:
        - minecraft:nether_gold_ore
        - minecraft:nether_quartz_ore
        - minecraft:ancient_debris

