    # RAM Cache for processed packets (faster resending)
    # Higher = more RAM usage, faster chunk resending
    max-cached-packets: 2000

    # Memory cache for NMS chunk objects (reuses loaded chunks)
    # Recommended: true for small servers, false for large servers or low RAM
    enable-memory-cache: true
    max-memory-cache-size: 500

    # Surface Only Mode: Only sends visible surface blocks
    # Pros: Massive bandwidth savings, built-in anti-xray
    # Cons: High CPU for initial generation (mitigated by disk-cache)
    surface-only-mode: false
    depth-below-surface: 40

    # Persistent disk cache (SQLite): Saves processed packets to disk
    # Highly recommended - allows instant loading of previously visited chunks
    disk-cache: true

    # Compress packets before saving to disk (slower but smaller files)
    use-compression: false

    # Anti-Xray for fake chunks
    # True: Ores hidden in distance, higher CPU usage
    # False: Raw chunk data, faster but xray-able
    enable-anti-xray: false

  # Occlusion Culling: Disables fake chunks when player is underground
  # Saves bandwidth when player can't see the distance anyway
  occlusion-culling:
    enabled: true
    sky-light-threshold: 14
    max-y-level: 320
    min-y-level: -64

# Bandwidth management
