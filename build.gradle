plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'checkstyle'
}

group = 'me.mapacheee'
version = '3.1.7-release'
description = 'ExtendedHorizons - Advanced view distance extension plugin'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
      name = 'faststatsReleases'
      url = 'https://repo.faststats.dev/releases'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'codemc-repo'
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
    maven {
        name = 'codemc-snapshots'
        url = 'https://repo.codemc.io/repository/maven-snapshots/'
    }
    maven {
        name = 'enginehub-repo'
        url = 'https://maven.enginehub.org/repo/'
    }
}

dependencies {
    compileOnlyApi("me.mapacheee:MapacheeeLib:1.0.1")
    annotationProcessor("me.mapacheee:MapacheeeLib:1.0.1")
    paperweight.paperDevBundle("26.2.build.+")

    /*compileOnly("com.thewinterframework:paper:2.1.1")
    annotationProcessor("com.thewinterframework:paper:2.1.1")
    compileOnly("com.thewinterframework:configuration:2.0.0")
    annotationProcessor("com.thewinterframework:configuration:2.0.0")
    compileOnly("com.thewinterframework:command:2.0.0") {
        exclude group: "org.incendo", module: "cloud-paper"
        exclude group: "org.incendo", module: "cloud-annotations"
    }
    annotationProcessor("com.thewinterframework:command:2.0.0")*/

    implementation("dev.faststats.metrics:bukkit:0.29.0")
    compileOnly("me.clip:placeholderapi:2.12.2")
    compileOnly(platform("com.intellectualsites.bom:bom-newest:1.56"))
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Core")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit") { transitive = false }
}

// Workaround: Winter v2 AP reads META-INF/winter/exposed-classes.txt via
// Filer.getResource(CLASS_PATH, ...), but paperweight's custom FileManager
// cannot open that entry from inside MapacheeeLib's JAR. We create the file
// as a loose directory on the compile classpath so the AP can find it.
def generatedWinterDir = layout.buildDirectory.dir("generated/classpath/winter").get().asFile

tasks.register("generateWinterExposedClasses") {
    doLast {
        def metaInfDir = new File(generatedWinterDir, "META-INF/winter")
        metaInfDir.mkdirs()
        def file = new File(metaInfDir, "exposed-classes.txt")
        if (!file.exists()) file.createNewFile()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    dependsOn("generateWinterExposedClasses")
    classpath = classpath + files(generatedWinterDir)
}

shadowJar {
    relocate 'com.github.benmanes.caffeine', 'me.mapacheee.lib.caffeine'
    relocate('dev.faststats', 'me.mapacheee.libs.faststats')
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Multi-Release': 'false'
        )
    }

    archiveBaseName = 'ExtendedHorizons'
    archiveClassifier = ''
    archiveVersion = project.version

    configurations = [project.configurations.runtimeClasspath]

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.build {
    dependsOn shadowJar
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching(['plugin.yml', 'paper-plugin.yml']) {
        expand(version: project.version, description: project.description)
    }
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file('checkstyle.xml')
    ignoreFailures = true
}
